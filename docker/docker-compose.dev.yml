version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# Task Manager — Development Stack
#
# Data is persisted in named volumes. Even if containers are removed or
# Docker Desktop is restarted, the data stays intact.
#
# Start:       docker compose -f docker-compose.dev.yml up -d
# Stop:        docker compose -f docker-compose.dev.yml down
# Wipe data:   docker compose -f docker-compose.dev.yml down -v
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: tm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskmanager
      POSTGRES_PASSWORD: taskmanager_dev
      POSTGRES_DB: taskmanager
    ports:
      - "5432:5432"
    volumes:
      # Persistent data volume — survives container removal
      - postgres_data:/var/lib/postgresql/data
      # Init script (only runs the first time, when the volume is empty)
      - ../scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmanager -d taskmanager"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      # Persistent Redis data — keeps the cache across restarts
      - redis_data:/data
      # Custom config for persistence
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── RabbitMQ ───────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: tm-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: taskmanager
      RABBITMQ_DEFAULT_PASS: taskmanager_dev
      # Keep a fixed hostname so the volume works correctly
      RABBITMQ_NODENAME: rabbit@tm-rabbitmq
    hostname: tm-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI
    volumes:
      # Persistent queues, exchanges, messages
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_log:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Adminer — PostgreSQL Web UI ────────────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: tm-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  # ── RedisInsight — Redis Web UI ────────────────────────────────────────────
  redisinsight:
    image: redis/redisinsight:latest
    container_name: tm-redisinsight
    restart: unless-stopped
    ports:
      - "8001:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy

# ─────────────────────────────────────────────────────────────────────────────
# Named Volumes — data lives independently of the container lifecycle
# Remove everything: docker compose -f docker-compose.dev.yml down -v
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
    labels:
      com.taskmanager.description: "PostgreSQL development data"
  redis_data:
    driver: local
    labels:
      com.taskmanager.description: "Redis development data"
  rabbitmq_data:
    driver: local
    labels:
      com.taskmanager.description: "RabbitMQ queues and exchanges"
  rabbitmq_log:
    driver: local
    labels:
      com.taskmanager.description: "RabbitMQ logs"
  redisinsight_data:
    driver: local
    labels:
      com.taskmanager.description: "RedisInsight settings"
