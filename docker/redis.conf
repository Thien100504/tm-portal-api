# Redis Development Configuration
# Mounted into the container via a volume in docker-compose.dev.yml

# ── Persistence ──────────────────────────────────────────────────────────────
# Save a snapshot every 60s if at least 1 key changed
save 60 1
# Extra safety: save every 300s if at least 10 keys changed
save 300 10

# Enable AOF (Append Only File) — more durable than RDB snapshots
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# ── Memory ───────────────────────────────────────────────────────────────────
# Limit RAM to avoid OOM (adjust for your dev machine)
maxmemory 256mb
maxmemory-policy allkeys-lru

# ── Networking ───────────────────────────────────────────────────────────────
# Bind all interfaces inside the container (Docker networking controls access)
bind 0.0.0.0
protected-mode no

# ── Logging ──────────────────────────────────────────────────────────────────
loglevel notice

# ── Pub/Sub (for the WebSocket listener) ─────────────────────────────────────
# No limit on pub/sub clients
# (the default is fine, stated explicitly for discoverability)
